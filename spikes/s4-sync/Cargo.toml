[package]
name = "s4-sync"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike S4: freshness, history.list sync, offline cache, encryption comparison."

[features]
default = ["plain"]
plain = ["rusqlite/bundled"]
# Build with: cargo build --no-default-features --features sqlcipher
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
gtoken = { path = "../s0-token" }
base64 = "0.23"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.41", default-features = false, features = ["cache"] }
serde_json = "1"
tokio = { version = "1.54", features = ["time", "sync", "rt-multi-thread", "macros", "signal"] }
chacha20poly1305 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
