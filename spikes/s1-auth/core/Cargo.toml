[package]
name = "authcore"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spike S1: Gmail OAuth core (loopback+PKCE, DPAPI store, check, revoke, tokeninfo)."

[dependencies]
base64 = "0.23"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["net", "time", "io-util", "sync", "rt-multi-thread", "macros"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
