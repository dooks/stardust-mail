[package]
name = "starmail"
description = "Read-only multi-account Gmail client for Windows"
authors = ["ziggy"]
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "starmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[features]
default = ["custom-protocol"]
# Embeds the UI instead of expecting a dev server; needed for plain `cargo run` / `cargo build`.
custom-protocol = ["tauri/custom-protocol"]
# UI development only: canned data from a MockService instead of Gmail (WP-F).
mock = []

[dependencies]
mail-model.workspace = true
mail-service.workspace = true
# Mock only: the hostile-email fixture. The real path gets rendering through mail-service.
mail-render.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
